[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simulation-platform-backend"
version = "0.0.0"
description = "생산 이산 시뮬레이션 플랫폼 백엔드 (API/worker)"
requires-python = ">=3.12"
# 정확한 버전은 requirements.lock에 고정한다. 라이브러리 채택은 G0 검토 대상이다.
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic-settings",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
