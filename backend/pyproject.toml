[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simulation-platform-backend"
version = "0.0.0"
description = "생산 이산 시뮬레이션 플랫폼 백엔드 (API/worker)"
requires-python = ">=3.12"
# 정확한 버전은 requirements.lock에 고정한다. 라이브러리 채택은 G0 검토 대상이다.
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic-settings",
    "sqlalchemy",
    "alembic",
    "psycopg[binary]",
    "simpy>=4,<5",  # 가상 시간 이벤트 엔진(exact 4.1.2는 requirements.lock, ADR-0002)
    "tzdata",  # Windows에서 zoneinfo(IANA 시간대) 검증에 필요
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# 다른 시험 모듈의 pytest 픽스처를 import해 재사용하므로 인자 이름이 import 이름을 가린다(F811).
"tests/integration/test_api_runs.py" = ["F811"]
"tests/integration/test_api_run_events.py" = ["F811"]
"tests/integration/test_api_run_metrics.py" = ["F811"]
"tests/integration/test_api_run_bottlenecks.py" = ["F811"]
"tests/integration/test_api_run_timeline.py" = ["F811"]
"tests/integration/test_api_run_compare.py" = ["F811"]
"tests/integration/test_api_refresh_and_graphs.py" = ["F811"]
"tests/integration/test_api_carrier_assumptions.py" = ["F811"]
"tests/integration/test_api_run_report.py" = ["F811"]
"tests/integration/test_api_layouts.py" = ["F811"]
"tests/integration/test_api_process_links.py" = ["F811"]
"tests/integration/test_api_layout_travel_run.py" = ["F811"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI의 의존성·파라미터 선언 관용구는 기본값 호출 경고에서 제외한다.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]
