[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os
# The URL is injected via the DATABASE_URL environment variable (see env.py).
# Keep this file ASCII-only: configparser reads it with the OS default encoding.
sqlalchemy.url =

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
